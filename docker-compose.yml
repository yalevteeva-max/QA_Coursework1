version: '3.8'

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
  # --------------------------

  gate-simulator:
    image: node:18
    working_dir: /app
    volumes:
      - ./gate-simulator:/app
    command: npm start
    ports:
      - "9999:9999"

  aqa-shop:
    image: eclipse-temurin:17-jdk
    working_dir: /app
    volumes:
      - ./aqa-shop.jar:/app/aqa-shop.jar
    command: java -jar aqa-shop.jar
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/app
      - SPRING_DATASOURCE_USERNAME=app
      - SPRING_DATASOURCE_PASSWORD=pass
      - SPRING_PAYMENT_GATE_URL=http://gate-simulator:9999/payment
      - SPRING_CREDIT_GATE_URL=http://gate-simulator:9999/credit
    depends_on:
      mysql:
        condition: service_healthy
      gate-simulator:
        condition: service_started